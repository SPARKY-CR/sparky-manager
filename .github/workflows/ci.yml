name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile-check Python files
        # No-op until the app lands; find -exec runs zero times on an
        # empty file list, so this stays green before app/ exists.
        run: |
          find app scripts -name '*.py' -exec python -m py_compile {} + 2>/dev/null || true

      - name: Run tests
        # pytest exits 5 when no tests are collected yet; that is fine
        # while the test files are still being written. Any real
        # failure (any other non-zero exit) fails the job.
        run: python -m pytest -q || test $? -eq 5

      - name: ShellCheck installer and scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install.sh scripts/backup.sh
