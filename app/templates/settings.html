{% extends "base.html" %}
{% block title %} — {{ t.settings }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>{{ t.settings }}</h1>
</div>

<div class="card card-narrow">
  <form method="post" action="{{ base_path }}/settings">
    <label>
      {{ t.domain }}
      <input type="text" name="domain" value="{{ settings.get('domain', '') }}" dir="ltr">
    </label>
    <label>
      {{ t.subscription_host }}
      <input type="text" name="subscription_host" value="{{ settings.get('subscription_host', '') }}" dir="ltr">
    </label>
    <label>
      {{ t.reality_sni }}
      <input type="text" name="reality_sni" value="{{ settings.get('reality_sni', 'www.microsoft.com') }}" dir="ltr">
    </label>
    <label>
      {{ t.log_level }}
      <select name="log_level" dir="ltr">
        {% for lv in ["DEBUG", "INFO", "WARNING", "ERROR"] %}
        <option value="{{ lv }}"{% if settings.get('log_level', 'INFO') == lv %} selected{% endif %}>{{ lv }}</option>
        {% endfor %}
      </select>
      <span class="muted">{{ t.log_level_hint }}</span>
    </label>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ t.save }}</button>
    </div>
  </form>
</div>
{% endblock %}
